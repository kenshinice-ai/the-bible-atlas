# =============================================================
# 圣经舆图 The Bible Atlas — 主机 nginx 反向代理(Caddy 的替代方案)
#
# 适用场景:服务器上已有 nginx(或偏好 nginx + certbot)。
# 此时部署栈不启用 caddy profile(deploy.sh 用 ATLAS_PROXY_PROFILE=none),
# api/web 容器只发布到 127.0.0.1:4000 / 127.0.0.1:8080,由本文件代理。
#
# 安装:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/bible-atlas.conf
#   把下面的 atlas.example.com 全部替换为真实域名
#   sudo ln -s /etc/nginx/sites-available/bible-atlas.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d atlas.example.com   # 自动补写 443/TLS 配置
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name atlas.example.com;

    # 文本响应压缩(JSON 尤其重要:atlas 索引约 700KB → ~100KB)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # ---- API:/api/* 与 /health → api 容器(127.0.0.1:4000) ----
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- 静态资源:Vite 产物带内容 hash,可永久缓存 ----
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- 其余请求(index.html 与 SPA 路由)→ web 容器 ----
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}
