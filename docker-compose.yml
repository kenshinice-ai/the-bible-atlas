name: literary-atlas

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-literary_atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_local_only}
    ports: ["5432:5432"]
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/10-initial.sql:ro
      - ./db/seeds/001_four_works.sql:/docker-entrypoint-initdb.d/20-four-works.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas_local_only}@db:5432/${POSTGRES_DB:-literary_atlas}
      API_PORT: 4000
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  atlas_pgdata:
